version: 2

updates:
   # pnpm workspace: root plus every app and package manifest.
   - package-ecosystem: "npm"
     directories:
        - "/"
        - "/apps/*"
        - "/packages/*"
     schedule:
        interval: "weekly"
     groups:
        minor-and-patch:
           update-types:
              - "minor"
              - "patch"
     open-pull-requests-limit: 10

   # GitHub Actions workflows.
   - package-ecosystem: "github-actions"
     directory: "/"
     schedule:
        interval: "weekly"
     groups:
        minor-and-patch:
           update-types:
              - "minor"
              - "patch"
     open-pull-requests-limit: 10
