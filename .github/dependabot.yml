version: 2
updates:
   - package-ecosystem: github-actions
     directory: /
     schedule:
        interval: weekly
   - package-ecosystem: docker
     directories:
        - /apps/api
        - /apps/web
        - /apps/landing
     schedule:
        interval: weekly
   - package-ecosystem: docker-compose
     directory: /
     schedule:
        interval: weekly
   - package-ecosystem: npm
     directory: /
     schedule:
        interval: weekly
