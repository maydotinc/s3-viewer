name: Docker images

# publishes the web and api images to GHCR so self-hosters can pull instead of building.
# `edge` follows main; version tags (v1.2.3) also publish 1.2.3, 1.2 and latest.
on:
   workflow_dispatch:
   push:
      branches: [main]
      tags: ["v*"]

concurrency:
   group: docker-images-${{ github.ref }}
   cancel-in-progress: false

permissions:
   contents: read

jobs:
   publish:
      runs-on: ubuntu-latest
      timeout-minutes: 60
      permissions:
         contents: read
         packages: write
      strategy:
         fail-fast: false
         matrix:
            app: [web, api]
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false
         - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
         - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
         - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
           with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
         - id: meta
           uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
           with:
              images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
              tags: |
                 type=edge,branch=main
                 type=semver,pattern={{version}}
                 type=semver,pattern={{major}}.{{minor}}
                 type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
         - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
           with:
              context: .
              file: apps/${{ matrix.app }}/Dockerfile
              platforms: linux/amd64,linux/arm64
              push: true
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}
              cache-from: type=gha,scope=${{ matrix.app }}
              cache-to: type=gha,mode=max,scope=${{ matrix.app }}
