name: CI

on:
   workflow_dispatch:
   pull_request:
      branches: [main]
   push:
      branches: [main]
      tags: ["v*"]

concurrency:
   group: ci-${{ github.ref }}
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
   contents: read

jobs:
   verify:
      runs-on: ubuntu-latest
      timeout-minutes: 20
      strategy:
         matrix:
            node: ["22.12.0", "22"]
      env:
         S3_INTEGRATION_ENDPOINT: ""
      services:
         postgres:
            image: postgres:16
            env:
               POSTGRES_PASSWORD: postgres
            ports:
               - 5432:5432
            options: >-
               --health-cmd "pg_isready -U postgres"
               --health-interval 5s
               --health-timeout 5s
               --health-retries 10
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: ${{ matrix.node }}
              cache: pnpm
         - run: pnpm install --frozen-lockfile
         # the ignored advisory is reachable only through dev tooling (eslint-config).
         - name: Audit production dependencies
           if: matrix.node == '22'
           run: pnpm audit --prod --audit-level=high
         - run: pnpm format:check
           if: matrix.node == '22'
         - run: pnpm --filter @s3-viewer/db db:generate
         - name: Check the schema matches the migrations
           if: matrix.node == '22'
           run: >-
              pnpm --filter @s3-viewer/db exec prisma migrate diff
              --from-migrations prisma/migrations
              --to-schema-datamodel prisma/schema.prisma
              --shadow-database-url postgresql://postgres:postgres@localhost:5432/postgres
              --exit-code
         - run: pnpm lint
         - run: pnpm check-types
         - name: Create the disposable integration database
           run: >-
              psql postgresql://postgres:postgres@localhost:5432/postgres
              -v ON_ERROR_STOP=1
              -c 'CREATE DATABASE s3viewer_smoke'
         - name: Migrate the integration database
           run: pnpm --filter @s3-viewer/db db:deploy
           env:
              DATABASE_URL: postgresql://postgres:postgres@localhost:5432/s3viewer_smoke
         - run: pnpm test
           env:
              # the PostgreSQL integration suites only run against a database named s3viewer_smoke.
              DATABASE_INTEGRATION_URL: postgresql://postgres:postgres@localhost:5432/s3viewer_smoke
         - run: pnpm build
           if: matrix.node == '22'
           env:
              NEXT_PUBLIC_SITE_URL: http://localhost:3000

   distribution:
      runs-on: ubuntu-latest
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: "22"
              cache: pnpm
         - run: pnpm install --frozen-lockfile
         - run: pnpm --filter @s3-viewer/db db:generate
         - run: pnpm test:distribution
