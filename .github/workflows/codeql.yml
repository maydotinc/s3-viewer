name: CodeQL

on:
   push:
      branches: [main]
   pull_request:
   schedule:
      - cron: "27 4 * * 1"

concurrency:
   group: codeql-${{ github.ref }}
   cancel-in-progress: true

permissions:
   contents: read

jobs:
   analyze:
      runs-on: ubuntu-latest
      permissions:
         contents: read
         security-events: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false

         - name: Initialize CodeQL
           uses: github/codeql-action/init@a45bef097606dca6eac8285c279babedd70e6dfd # v3.37.9
           with:
              languages: javascript-typescript
              queries: security-extended

         - name: Analyze
           uses: github/codeql-action/analyze@a45bef097606dca6eac8285c279babedd70e6dfd # v3.37.9
