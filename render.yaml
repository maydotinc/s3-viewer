# Render supplies service hosts, not origins; enter full URLs below.

databases:
   - name: s3-viewer-db
     plan: 0.1c-256mb
     databaseName: s3viewer
     user: s3viewer
     ipAllowList: []

services:
   - type: web
     name: s3-viewer-api
     runtime: docker
     plan: 1c-2g
     dockerfilePath: ./apps/api/Dockerfile
     dockerContext: .
     healthCheckPath: /health
     disk:
        name: s3-viewer-data
        mountPath: /data
        sizeGB: 1
     envVars:
        - key: DATABASE_URL
          fromDatabase:
             name: s3-viewer-db
             property: connectionString
        - key: DATA_DIR
          value: /data
        # sync: false prompts only on creation; later dashboard edits persist.
        - key: NEXT_PUBLIC_SITE_URL
          sync: false
        - key: NEXT_PUBLIC_API_URL
          sync: false
        - key: TRUST_PROXY
          value: "1"
        # onrender.com is a public suffix, so web and api are different sites.
        - key: COOKIE_SAMESITE
          value: none
        - key: EMAIL_TRANSPORT
          value: none
        - key: AUDIT_RETENTION_DAYS
          value: "365"
        # a 1 CPU / 2 GB instance: 512 MiB of upload buffers leaves 1.5 GB for Node, TLS and Postgres traffic.
        - key: UPLOAD_MEMORY_BUDGET_BYTES
          value: "536870912"
        # 16 MiB parts: a 2 GiB upload is about 130 requests instead of 400, and parts stay small enough
        # that the pool is shared across users. the API refuses to boot when four buffers of a part reach the budget.
        - key: UPLOAD_PART_BYTES
          value: "16777216"
        # 16 parts in flight is 256 MiB, which saturates one CPU with room left for zips.
        - key: MAX_CONCURRENT_UPLOADS
          value: "16"

   - type: web
     name: s3-viewer-web
     runtime: docker
     plan: 0.5c-512mb
     dockerfilePath: ./apps/web/Dockerfile
     dockerContext: .
     healthCheckPath: /api/health
     envVars:
        - key: NEXT_PUBLIC_SITE_URL
          sync: false
        - key: NEXT_PUBLIC_API_URL
          sync: false
