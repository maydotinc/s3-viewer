# Render Blueprint: api + web from the Dockerfiles, managed Postgres, 1 GB disk
# on /data for the API's generated keys. Runbook: SELF-HOSTING.md → Platform
# deploys → Render. Render can only wire a host between services, never a full
# origin, so the two URLs are `sync: false`: paste them when prompted, e.g.
# https://s3-viewer-web.onrender.com and https://s3-viewer-api.onrender.com.

databases:
   - name: s3-viewer-db
     plan: 0.1c-256mb
     databaseName: s3viewer
     user: s3viewer

services:
   - type: web
     name: s3-viewer-api
     runtime: docker
     plan: 0.5c-512mb
     dockerfilePath: ./apps/api/Dockerfile
     dockerContext: .
     healthCheckPath: /health
     disk:
        name: s3-viewer-data
        mountPath: /data
        sizeGB: 1
     envVars:
        - key: DATABASE_URL
          fromDatabase:
             name: s3-viewer-db
             property: connectionString
        - key: DATA_DIR
          value: /data
        - key: NEXT_PUBLIC_SITE_URL
          sync: false
        - key: NEXT_PUBLIC_API_URL
          sync: false
        - key: TRUST_PROXY
          value: "1"
        # onrender.com is a public suffix, so web and api are different sites.
        - key: COOKIE_SAMESITE
          value: none
        - key: EMAIL_TRANSPORT
          value: none

   - type: web
     name: s3-viewer-web
     runtime: docker
     plan: 0.5c-512mb
     dockerfilePath: ./apps/web/Dockerfile
     dockerContext: .
     healthCheckPath: /api/health
     envVars:
        - key: NEXT_PUBLIC_SITE_URL
          sync: false
        - key: NEXT_PUBLIC_API_URL
          sync: false
