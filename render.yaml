# Render Blueprint: api + web from the Dockerfiles, managed Postgres, 1 GB disk
# on /data for the API's generated keys. Runbook: SELF-HOSTING.md → Platform
# deploys → Render. Render can only wire a host between services, never a full
# origin, so the two URLs are `sync: false`: paste them when prompted, e.g.
# https://s3-viewer-web.onrender.com and https://s3-viewer-api.onrender.com.

databases:
   - name: s3-viewer-db
     plan: 0.1c-256mb
     databaseName: s3viewer
     user: s3viewer

services:
   - type: web
     name: s3-viewer-api
     runtime: docker
     plan: 0.5c-512mb
     dockerfilePath: ./apps/api/Dockerfile
     dockerContext: .
     healthCheckPath: /health
     disk:
        name: s3-viewer-data
        mountPath: /data
        sizeGB: 1
     envVars:
        - key: DATABASE_URL
          fromDatabase:
             name: s3-viewer-db
             property: connectionString
        - key: DATA_DIR
          value: /data
        - key: NEXT_PUBLIC_SITE_URL
          sync: false
        - key: NEXT_PUBLIC_API_URL
          sync: false
        - key: TRUST_PROXY
          value: "1"
        # onrender.com is a public suffix, so web and api are different sites.
        - key: COOKIE_SAMESITE
          value: none
        - key: EMAIL_TRANSPORT
          value: none
        # All four are optional and default sensibly in code (RUN_MIGRATIONS=
        # true, RATE_LIMIT_STORE=memory, SIGNUP_MODE=open, no domain allowlist).
        # SIGNUP_MODE also accepts domains | invite | closed — see SELF-HOSTING.md.
        # `sync: false` only prompts once, at Blueprint creation, and Render
        # ignores these keys on later Blueprint syncs — a later dashboard edit
        # sticks. If the creation prompt won't accept a blank value, enter the
        # default shown above; that is equivalent to leaving it unset. Scaling
        # this service to more than one instance needs RATE_LIMIT_STORE=postgres
        # (see SELF-HOSTING.md); a second, non-migrating replica needs its own
        # RUN_MIGRATIONS=false set by hand, since Blueprint services share one
        # env var value across their instances.
        - key: RUN_MIGRATIONS
          sync: false
        - key: RATE_LIMIT_STORE
          sync: false
        - key: SIGNUP_MODE
          sync: false
        - key: ALLOWED_EMAIL_DOMAINS
          sync: false

   - type: web
     name: s3-viewer-web
     runtime: docker
     plan: 0.5c-512mb
     dockerfilePath: ./apps/web/Dockerfile
     dockerContext: .
     healthCheckPath: /api/health
     envVars:
        - key: NEXT_PUBLIC_SITE_URL
          sync: false
        - key: NEXT_PUBLIC_API_URL
          sync: false
