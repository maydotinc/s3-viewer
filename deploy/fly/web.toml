app = "your-s3-viewer-web"
primary_region = "iad"

[build]
   dockerfile = "apps/web/Dockerfile"

[env]
   NEXT_PUBLIC_SITE_URL = "https://your-s3-viewer-web.fly.dev"
   NEXT_PUBLIC_API_URL = "https://your-s3-viewer-api.fly.dev"

[http_service]
   internal_port = 3000
   force_https = true
   auto_stop_machines = "off"
   auto_start_machines = true
   min_machines_running = 1

   [[http_service.checks]]
      method = "GET"
      path = "/api/health"
      interval = "15s"
      timeout = "5s"
      grace_period = "20s"

[[vm]]
   size = "shared-cpu-1x"
   memory = "512mb"
