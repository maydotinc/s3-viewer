   postcss: ^8.5.28
   qs: ^6.16.0
   rollup: ^4.63.1
   sharp: ^0.35.5
   "brace-expansion@1": ^1.1.21
   "brace-expansion@2": ^2.1.7
   "brace-expansion@5": ^5.0.12
   "glob@10": ^10.5.0
   "js-yaml@4": ^4.3.2
