packages:
   - apps/*
   - packages/*

# dev-only advisory with no runtime path: braces via eslint tooling.
auditConfig:
   ignoreGhsas:
      - GHSA-vfj7-8cjw-p6xm

catalog:
   "@prisma/client": ^6.1.0
   "@tailwindcss/postcss": ^4.3.3
   better-auth: ^1.7.2
   eslint: ^9.28.0
   next: 15.5.27
   prisma: ^6.1.0
   react: ^19.1.0
   react-dom: ^19.1.0
   tailwindcss: ^4.3.3
   typescript: ^5.8.3
   zod: ^3.25.67
   vitest: ^4.1.11

# better-call uses zod only for instanceof checks in its OpenAPI docs generator, which this app never serves; the app stays on zod 3.
peerDependencyRules:
   allowedVersions:
      "better-call>zod": "3"

onlyBuiltDependencies:
   - "@prisma/client"
   - "@prisma/engines"
   - "@tailwindcss/oxide"
   - esbuild
   - prisma
   - sharp

# floors for advisories fixed upstream. postcss is load-bearing (next pins 8.4.31 exactly); the rest only guard a stale lockfile
overrides:
   "@eslint/plugin-kit@0.3": ^0.3.4
   "@humanfs/node@0.16": ^0.16.8
   "ajv@6": ^6.14.0
   body-parser: ^2.3.0
   defu: ^6.1.7
   flatted: ^3.4.4
   ip-address: ^10.7.3
   nanoid: ^3.3.18
   path-to-regexp: ^8.4.2
   proxy-addr: ^2.0.8
   postcss: ^8.5.28
   qs: ^6.16.0
   rollup: ^4.63.1
   source-map-js: ^1.2.2
   "brace-expansion@1": ^1.1.21
   "brace-expansion@2": ^2.1.7
   "brace-expansion@5": ^5.0.12
   "glob@10": ^10.5.0
   "js-yaml@4": ^4.3.2
   "minimatch@3": ^3.1.5
   "minimatch@9": ^9.0.9
   "picomatch@2": ^2.3.2
   "picomatch@4": ^4.0.7
