packages:
   - apps/*
   - packages/*

# dev-only advisories with no runtime path: braces via eslint tooling, source-map-js via vite.
auditConfig:
   ignoreGhsas:
      - GHSA-vfj7-8cjw-p6xm
      - GHSA-68fv-2mgg-jv7q

catalog:
   "@prisma/client": ^6.1.0
   "@tailwindcss/postcss": ^4.3.3
   better-auth: ^1.7.2
   eslint: ^9.28.0
   next: 15.5.27
   prisma: ^6.1.0
   react: ^19.1.0
   react-dom: ^19.1.0
   tailwindcss: ^4.3.3
   typescript: ^5.8.3
   zod: ^3.25.67
   vitest: ^4.1.11

onlyBuiltDependencies:
   - "@prisma/client"
   - "@prisma/engines"
   - "@tailwindcss/oxide"
   - esbuild
   - prisma
   - sharp

overrides:
   "@eslint/plugin-kit@0.3": ^0.3.4
   "@humanfs/node@0.16": ^0.16.8
   "ajv@6": ^6.14.0
